# DEMO: notifications go to the local Mailpit SMTP catcher (see docker-compose.yml).
# For a real deployment, replace smtp_smarthost / email_configs with your SMTP
# provider or swap the receiver for slack_configs / webhook_configs.
global:
  smtp_smarthost: "mailpit:1025"
  smtp_from: "alertmanager@pix-observability.local"
  smtp_require_tls: false

route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    email_configs:
      - to: "oncall@pix-observability.local"

services:
  postgres:
    image: postgres:17-alpine
    container_name: pix-postgres
    environment:
      POSTGRES_DB: pix_observability
      POSTGRES_USER: ${DATABASE_USERNAME:-pix}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-pix_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: pix-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    # transaction-service and external-partner-mock run on the host (via
    # ./mvnw spring-boot:run), not as containers in this compose file.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: pix-alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: pix-mailpit
    ports:
      - "1025:1025"   # SMTP (AlertManager envia para aqui)
      - "8025:8025"   # UI/API: http://localhost:8025

  grafana:
    image: grafana/grafana:11.4.0
    container_name: pix-grafana
    depends_on:
      - prometheus
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "3000:3000"

volumes:
  postgres-data:

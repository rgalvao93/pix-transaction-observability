spring.application.name=external-partner-mock
server.port=8081

# --- Database ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pix_observability}
spring.datasource.username=${DATABASE_USERNAME:pix}
spring.datasource.password=${DATABASE_PASSWORD:pix_local_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=partner_mock
spring.flyway.enabled=true
spring.flyway.schemas=partner_mock
spring.flyway.default-schema=partner_mock

# --- Observability ---
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# --- Security / JWT ---
# REQUIRED since issue #11: no default on purpose — boot fails without it.
# Must match the transaction-service secret so tokens issued there validate here.
security.jwt.secret=${SECURITY_JWT_SECRET}

# --- Mock behavior ---
partner.mock.latency.min-ms=${PARTNER_MOCK_LATENCY_MIN_MS:100}
partner.mock.latency.max-ms=${PARTNER_MOCK_LATENCY_MAX_MS:500}
partner.mock.failure-rate=${PARTNER_MOCK_FAILURE_RATE:0.05}

spring.application.name=external-partner-mock
server.port=8081

# --- Observability ---
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# --- Security / JWT ---
# DEMO ONLY: must match the transaction-service secret so tokens it issues validate here.
# Override both services via the SECURITY_JWT_SECRET env var in any real deployment.
security.jwt.secret=${SECURITY_JWT_SECRET:demo-only-jwt-secret-change-me-in-production-1234567890}

# --- Mock behavior ---
partner.mock.latency.min-ms=${PARTNER_MOCK_LATENCY_MIN_MS:100}
partner.mock.latency.max-ms=${PARTNER_MOCK_LATENCY_MAX_MS:500}
partner.mock.failure-rate=${PARTNER_MOCK_FAILURE_RATE:0.05}

spring.application.name=external-partner-mock
security.jwt.secret=demo-only-jwt-secret-change-me-in-production-1234567890

spring.datasource.url=jdbc:h2:mem:partnertest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=partner_mock
spring.flyway.schemas=partner_mock
spring.flyway.default-schema=partner_mock

partner.mock.latency.min-ms=0
partner.mock.latency.max-ms=0
partner.mock.failure-rate=0.0

spring.application.name=transaction-service

# --- Database ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pix_observability}
spring.datasource.username=${DATABASE_USERNAME:pix}
spring.datasource.password=${DATABASE_PASSWORD:pix_local_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=transaction_service
spring.flyway.enabled=true
spring.flyway.schemas=transaction_service
spring.flyway.default-schema=transaction_service

# --- Observability ---
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.group.readiness.include=readinessState,partnerConnectivity,db

# --- Security / JWT ---
# DEMO ONLY: override via SECURITY_JWT_SECRET env var in any real deployment.
security.jwt.secret=${SECURITY_JWT_SECRET:demo-only-jwt-secret-change-me-in-production-1234567890}
security.jwt.expiration-ms=3600000

# --- External Partner (external-partner-mock, Fase 3) ---
partner.base-url=${PARTNER_BASE_URL:http://localhost:8081}
partner.connect-timeout-ms=1000
partner.read-timeout-ms=2000
partner.retry.max-attempts=3
partner.retry.backoff-ms=200

# --- Business rules ---
transaction.cash-out.daily-limit=5000.00

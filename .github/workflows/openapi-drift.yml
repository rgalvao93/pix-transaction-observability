name: OpenAPI contract drift

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  drift:
    name: Check api-spec vs /v3/api-docs
    runs-on: ubuntu-latest
    env:
      # CI-only throwaway value: SECURITY_JWT_SECRET has no default (issue #11),
      # so the services refuse to boot without it.
      SECURITY_JWT_SECRET: ci-only-openapi-drift-not-a-real-secret
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pix_observability
          POSTGRES_USER: pix
          POSTGRES_PASSWORD: pix_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install PyYAML (export script)
        run: python3 -m pip install --user PyYAML

      - name: Start external-partner-mock (:8081)
        working-directory: external-partner-mock
        run: |
          ./mvnw -q -B spring-boot:run > /tmp/mock.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:8081/v3/api-docs 2>/dev/null | grep -q '"openapi"' && break
            sleep 5
          done
          curl -fs http://localhost:8081/v3/api-docs | grep -q '"openapi"'

      - name: Start transaction-service (:8080)
        working-directory: transaction-service
        run: |
          ./mvnw -q -B spring-boot:run > /tmp/ts.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/v3/api-docs 2>/dev/null | grep -q '"openapi"' && break
            sleep 5
          done
          curl -fs http://localhost:8080/v3/api-docs | grep -q '"openapi"'

      - name: Regenerate contract from running services
        run: ./scripts/export-openapi.sh

      - name: Dump service logs (on failure)
        if: failure()
        run: |
          echo '===== /tmp/ts.log (transaction-service) ====='
          tail -100 /tmp/ts.log || true
          echo '===== /tmp/mock.log (external-partner-mock) ====='
          tail -100 /tmp/mock.log || true

      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- api-spec/; then
            echo "::error::Drift entre a API implementada (/v3/api-docs) e o contrato versionado em api-spec/."
            echo "Rode './scripts/export-openapi.sh' com os dois serviços no ar e commite o resultado."
            exit 1
          fi